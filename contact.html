<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Bona+Nova+SC:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Angkor&display=swap" rel="stylesheet">
</head>
<body>
<body class="animate__animated animate__fadeIn">
  <div class="grid-container">

    <div class="navbar">
      <nav>
        <a href="index.html" id="logo">MY PORTFOLIO</a>
        <div class="hamburger" id="hamburger">☰</div>
        <ul id="nav-menu">
          <li><a href="index.html">HOME</a></li>
          <li><a href="about.html">ABOUT</a></li>
          <li><a href="contact.html" class="active">CONTACT US</a></li>
        </ul>
      </nav>
    </div>

    <div class="text-section centered">

      <p>If you’d like to collaborate, ask a question, or just say hello — feel free to reach out through any of the following:</p>

    <div class="footer-section">

  </div>

  <script>
    const hamburger = document.getElementById("hamburger");
    const navMenu = document.getElementById("nav-menu");
    hamburger.addEventListener("click", () => {
      navMenu.classList.toggle("show");
    });
  </script>

<script>
  const links = document.querySelectorAll('a');
  links.forEach(link => {
    link.addEventListener('click', e => {
      const href = link.getAttribute('href');
      if (href && href.endsWith('.html')) {
        e.preventDefault();
        document.body.classList.remove('animate__fadeIn');
        document.body.classList.add('animate__fadeOut');
        setTimeout(() => {
          window.location.href = href;
        }, 500);
      }
    });
  });
</script>

</body>
</html>
